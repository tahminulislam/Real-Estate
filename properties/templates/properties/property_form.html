<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} | Velora</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #111827;
        }

        .form-container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        input, textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #2563eb;
        }

        .errorlist {
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h1>{{ page_title }}</h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Save Property</button>
        </form>

        <p>
            <a href="{% url 'property_dashboard' %}">
                Back to Dashboard
            </a>
        </p>
    </div>
</body>
</html>
